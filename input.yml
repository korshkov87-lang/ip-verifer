<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Верификация</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #4CAF50;
            font-size: 48px;
            margin: 20px 0;
        }
        .error {
            color: #f44336;
            font-size: 48px;
            margin: 20px 0;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.5;
        }
        .ip-box {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 18px;
            margin: 20px 0;
            word-break: break-all;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            background: #5a67d8;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        .debug {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 10px;
            margin-top: 20px;
            font-size: 11px;
            text-align: left;
            color: #666;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loader"></div>
        <h2>Проверка подключения</h2>
        <p>Пожалуйста, подождите. Мы проверяем ваше подключение...</p>
    </div>

    <script>
        // Функция для отображения отладочной информации
        function showDebug(message, isError = false) {
            const debugDiv = document.createElement('div');
            debugDiv.className = 'debug';
            debugDiv.style.background = isError ? '#fee' : '#e8f5e9';
            debugDiv.style.border = isError ? '1px solid #fcc' : '1px solid #c8e6c9';
            debugDiv.innerHTML = `<strong>${isError ? '❌ Ошибка' : 'ℹ️ Инфо'}:</strong><br>${message}`;
            const appDiv = document.getElementById('app');
            if (appDiv && !document.querySelector('.debug')) {
                appDiv.appendChild(debugDiv);
            }
        }

        // Функция для получения IP с несколькими запасными вариантами
        async function getIP() {
            const services = [
                { url: 'https://api.ipify.org?format=json', parse: (data) => data.ip },
                { url: 'https://api.my-ip.io/ip.json', parse: (data) => data.ip },
                { url: 'https://ipapi.co/json/', parse: (data) => data.ip },
                { url: 'https://api64.ipify.org?format=json', parse: (data) => data.ip }
            ];
            
            for (const service of services) {
                try {
                    showDebug(`Попытка получить IP через: ${service.url}`);
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);
                    const response = await fetch(service.url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        const data = await response.json();
                        let ip = service.parse(data);
                        if (ip && typeof ip === 'string' && ip.match(/^[\d\.]+$/)) {
                            showDebug(`✅ IP получен: ${ip} через ${service.url}`);
                            return ip;
                        }
                    }
                } catch (e) {
                    showDebug(`❌ Сервис ${service.url} не ответил: ${e.message}`, true);
                }
            }
            showDebug(`❌ Не удалось получить IP ни от одного сервиса`, true);
            return null;
        }

        // Функция для отправки данных боту
        async function sendToBot(ip) {
            // Проверяем, открыто ли приложение в Telegram
            if (window.Telegram && window.Telegram.WebApp) {
                const webApp = window.Telegram.WebApp;
                showDebug(`✅ Telegram WebApp найден, отправляем IP: ${ip}`);
                
                if (ip) {
                    const data = JSON.stringify({
                        type: 'ip',
                        ip: ip,
                        timestamp: new Date().toISOString(),
                        user_agent: navigator.userAgent
                    });
                    webApp.sendData(data);
                    showDebug(`✅ Данные отправлены в бота`);
                    setTimeout(() => webApp.close(), 1500);
                } else {
                    showDebug(`❌ IP не определен, отправляем ошибку`, true);
                    webApp.sendData(JSON.stringify({
                        type: 'error',
                        error: 'IP not detected',
                        timestamp: new Date().toISOString()
                    }));
                    setTimeout(() => webApp.close(), 2000);
                }
            } else {
                showDebug(`❌ Telegram WebApp не доступен. Приложение открыто вне Telegram?`, true);
                document.getElementById('app').innerHTML = `
                    <div class="error">⚠️</div>
                    <h2>Ошибка</h2>
                    <p>Пожалуйста, откройте эту страницу через Telegram бота.</p>
                    <p>Нажмите на кнопку ниже, чтобы вернуться</p>
                    <button onclick="window.close()">Закрыть</button>
                    <div class="footer">Telegram Mini App</div>
                `;
            }
        }

        // Инициализация Telegram WebApp
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                const webApp = window.Telegram.WebApp;
                webApp.ready();
                webApp.expand();
                showDebug(`✅ Telegram WebApp инициализирован, версия: ${webApp.version}`);
                return true;
            } else {
                showDebug(`⚠️ Telegram WebApp не обнаружен, ждем загрузку...`);
                // Некоторые версии Telegram загружают WebApp с задержкой
                setTimeout(() => {
                    if (window.Telegram && window.Telegram.WebApp) {
                        const webApp = window.Telegram.WebApp;
                        webApp.ready();
                        webApp.expand();
                        showDebug(`✅ Telegram WebApp инициализирован с задержкой, версия: ${webApp.version}`);
                    } else {
                        showDebug(`❌ Telegram WebApp не доступен. Убедитесь, что открыто через Telegram.`, true);
                    }
                }, 1000);
                return false;
            }
        }

        // Основная функция
        async function init() {
            showDebug(`🚀 Запуск мини-приложения...`);
            
            // Инициализируем Telegram WebApp
            initTelegramWebApp();
            
            // Получаем IP
            const ip = await getIP();
            
            if (ip) {
                document.getElementById('app').innerHTML = `
                    <div class="success">✓</div>
                    <h2>Верификация пройдена!</h2>
                    <p>Ваш IP-адрес:</p>
                    <div class="ip-box">${ip}</div>
                    <p>Передача данных в бота...</p>
                    <div class="loader" style="width:30px;height:30px;"></div>
                `;
                await sendToBot(ip);
            } else {
                document.getElementById('app').innerHTML = `
                    <div class="error">✗</div>
                    <h2>Ошибка определения IP</h2>
                    <p>Не удалось определить ваш IP-адрес.</p>
                    <p>Проверьте подключение к интернету и попробуйте снова.</p>
                    <button onclick="location.reload()">Повторить</button>
                    <div class="footer">Если проблема повторяется, обратитесь в поддержку</div>
                `;
            }
        }

        // Запуск после загрузки страницы
        window.addEventListener('load', init);
    </script>
</body>
</html>
